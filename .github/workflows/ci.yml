name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "1.98.1"
  RUST_TOOLCHAIN: "stable"

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check Rust format
        run: cargo fmt --all -- --check
      - name: Check GDScript format
        run: |
          pip install gdformat
          gdformat --check godot/scripts/
      - name: Check TOML format
        run: |
          pip install taplo
          taplo fmt --check **/*.toml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: GDLint
        run: |
          pip install gdlint
          gdlint godot/scripts/
      - name: Spell check
        run: |
          pip install typos-cli
          typos .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Godot headless test
        run: |
          # Requires Godot 4.x installed
          # godot --headless --script-check godot/project.godot
          echo "Godot test placeholder"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check licenses & bans
        run: cargo deny check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, lint, test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build Rust workspace
        run: cargo build --release --workspace
      - name: Verify GDExtension output
        run: |
          ls -la rust/target/release/libblink_gdext.*
        # Copy to godot/addons for Godot build
      - name: Build Godot (Linux)
        run: |
          # godot --headless --export-release "Linux/X11" build/linux/blink-arcana
          echo "Godot export placeholder"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t blink-arcana:${{ github.sha }} -f docker/Dockerfile .
      - name: Push to registry
        if: github.event_name == 'push'
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push blink-arcana:${{ github.sha }}

  deploy:
    name: Deploy (main only)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to staging
        run: echo "Deploy to staging environment"
        # kubectl apply -f k8s/staging/
