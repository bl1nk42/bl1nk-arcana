[package]
name = "blink-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Blink Arcana Project Management CLI"
publish = false

[[bin]]
name = "blink"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
colored = "2.1"
indicatif = "0.17"
walkdir = "2.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
