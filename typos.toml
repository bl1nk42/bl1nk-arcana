# Typos Configuration for Spell Checking
extends = ["typos"]

[files]
exclude = [
    "target/", "build/", "dist/", "*.lock", "*.min.js", "*.map",
    "node_modules/", ".git/", "*.wasm", "*.dylib", "*.so", "*.dll",
    "*.pdb", "*.profraw", "*.profdata", "coverage/", "test-results/",
    "rust/target/", "godot/.godot/", "godot/.import/", "*.uid",
    "docs/SETUP/*.md",
]
include = [
    "**/*.md", "**/*.rs", "**/*.gd", "**/*.toml", "**/*.yaml",
    "**/*.yml", "**/*.proto", "**/*.sh", "**/*.bash", "**/*.txt",
    "**/*.cfg", "**/*.ini", "justfile", "Justfile", "Makefile",
    "Dockerfile", ".buildkite/**", ".github/**", "scripts/**",
    "proto/**", "rust/**", "godot/scripts/**",
]

